/* =========================================================
   SHREE ERP — SINGLE FILE ACCOUNTING & POS APPLICATION
   ========================================================= */

const DB_KEY = 'shree_erp_db_v2';
const uid = (p='ID') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmt = (n) => 'NPR ' + (Number(n)||0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
const todayISO = () => new Date().toISOString().slice(0,10);

function adToBsApprox(adDateStr){
  try{
    const d = new Date(adDateStr);
    if(isNaN(d)) return '';
    const year = d.getFullYear();
    const bsYear = (d.getMonth() > 3 || (d.getMonth()===3 && d.getDate()>=14)) ? year+57 : year+56;
    const bsMonth = ((d.getMonth() + 9) % 12) + 1;
    const bsDay = d.getDate() <= 30 ? d.getDate() : 30;
    return `${bsYear}-${String(bsMonth).padStart(2,'0')}-${String(bsDay).padStart(2,'0')} (approx.)`;
  }catch(e){ return ''; }
}

function toast(msg, type='success'){
  const colors = {success:'bg-emerald-600', error:'bg-red-600', warning:'bg-amber-500', info:'bg-blue-600'};
  const icons = {success:'check-circle', error:'x-circle', warning:'alert-triangle', info:'info'};
  const el = document.createElement('div');
  el.className = `toast text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 text-sm ${colors[type]}`;
  el.innerHTML = `<i data-lucide="${icons[type]}" class="w-4 h-4"></i><span>${msg}</span>`;
  document.getElementById('toastBox').appendChild(el);
  lucide.createIcons();
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, 3500);
}

function openModal(html){
  document.getElementById('modalRoot').innerHTML = `
    <div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4" id="modalOverlay">
      <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">${html}</div>
    </div>`;
  lucide.createIcons();
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ---------- DATABASE ---------- */
let DB = null;

function defaultChartOfAccounts(){
  return [
    {id:'CASH', name:'Cash in Hand', type:'Asset', system:true},
    {id:'BANK', name:'Bank Account', type:'Asset', system:true},
    {id:'AR', name:'Accounts Receivable / Debtors', type:'Asset', system:true},
    {id:'INV', name:'Inventory / Stock Asset', type:'Asset', system:true},
    {id:'AP', name:'Accounts Payable / Creditors', type:'Liability', system:true},
    {id:'VAT', name:'VAT Payable (13%)', type:'Liability', system:true},
    {id:'SALES', name:'Sales Account', type:'Revenue', system:true},
    {id:'PURCH', name:'Purchase Account', type:'Expense', system:true},
    {id:'EXP', name:'General Expenses', type:'Expense', system:true},
  ];
}

function freshDB(){
  return {
    company: {name:'My Company Pvt. Ltd.', pan:'', address:'', fiscalYear:''},
    accounts: defaultChartOfAccounts(),
    customers: [],
    vendors: [],
    items: [],
    vouchers: [],
    budgets: [],
    billCounter: 1000,
    jvCounter: 1,
    trCounter: 1,
    payCounter: 1
  };
}

function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(!raw){ DB = freshDB(); saveDB(); }
  else{
    try{ DB = JSON.parse(raw); if(!DB.budgets) DB.budgets=[]; }
    catch(e){ DB = freshDB(); saveDB(); }
  }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

/* ---------- ACCOUNTING CORE ---------- */
function accountName(id){ const a = DB.accounts.find(x=>x.id===id); return a ? a.name : id; }

function postVoucher(voucher){
  const totalDebit = voucher.entries.reduce((s,e)=>s+(Number(e.debit)||0),0);
  const totalCredit = voucher.entries.reduce((s,e)=>s+(Number(e.credit)||0),0);
  if(Math.abs(totalDebit-totalCredit) > 0.009){
    throw new Error('Unbalanced entry: Debits ('+fmt(totalDebit)+') must equal Credits ('+fmt(totalCredit)+')');
  }
  DB.vouchers.push(voucher);
  saveDB();
}

function filterVouchers(from, to){
  return DB.vouchers.filter(v => (!from || v.date>=from) && (!to || v.date<=to));
}

function getLedgerEntries(accountId, from, to){
  const rows = [];
  filterVouchers(from,to).forEach(v=>{
    v.entries.forEach(e=>{
      if(e.account === accountId){
        rows.push({date:v.date, voucherId:v.id, billNo:v.billNo||v.id, type:v.type, narration:v.narration||'', debit:Number(e.debit)||0, credit:Number(e.credit)||0});
      }
    });
  });
  rows.sort((a,b)=> a.date.localeCompare(b.date));
  let bal = 0;
  return rows.map(r=>{ bal += (r.debit - r.credit); return {...r, balance:bal}; });
}

function getAccountBalance(accountId, from, to){
  let debit=0, credit=0;
  filterVouchers(from,to).forEach(v=> v.entries.forEach(e=>{
    if(e.account===accountId){ debit += Number(e.debit)||0; credit += Number(e.credit)||0; }
  }));
  return {debit, credit, net: debit-credit};
}

/* Per-party sub-ledger (fixes party net balance bug: AR/AP tracked per party, not just pooled) */
function getPartyEntries(partyId, account, from, to){
  const rows = [];
  filterVouchers(from,to).forEach(v=>{
    v.entries.forEach(e=>{
      if(e.account===account && e.party===partyId){
        rows.push({date:v.date, voucherId:v.id, billNo:v.billNo||v.id, type:v.type, narration:v.narration||'', debit:Number(e.debit)||0, credit:Number(e.credit)||0});
      }
    });
  });
  rows.sort((a,b)=> a.date.localeCompare(b.date));
  let bal=0;
  return rows.map(r=>{ bal += (r.debit-r.credit); return {...r, balance:bal}; });
}

// Customer: positive = customer owes us (Due / red). Negative = we owe customer / customer overpaid (Advance / green).
function customerBalance(custId, from, to){
  let d=0,c=0;
  filterVouchers(from,to).forEach(v=>v.entries.forEach(e=>{ if(e.account==='AR' && e.party===custId){ d+=Number(e.debit)||0; c+=Number(e.credit)||0; } }));
  return d-c;
}
// Vendor: positive = we owe vendor (Due / red). Negative = vendor owes us / we overpaid (Advance / green).
function vendorBalance(vendId, from, to){
  let d=0,c=0;
  filterVouchers(from,to).forEach(v=>v.entries.forEach(e=>{ if(e.account==='AP' && e.party===vendId){ d+=Number(e.debit)||0; c+=Number(e.credit)||0; } }));
  return c-d;
}

function deleteVouchers(ids){
  ids.forEach(id=>{
    const v = DB.vouchers.find(x=>x.id===id);
    if(!v) return;
    if(v.type==='Sale' && Array.isArray(v.items)){
      v.items.forEach(it=>{ const item = DB.items.find(i=>i.id===it.itemId); if(item) item.qty += it.qty; });
    }
    if(v.type==='Purchase' && Array.isArray(v.items)){
      v.items.forEach(it=>{ const item = DB.items.find(i=>i.id===it.itemId); if(item) item.qty -= it.qty; });
    }
  });
  DB.vouchers = DB.vouchers.filter(v=>!ids.includes(v.id));
  saveDB();
}

/* ---------- REUSABLE SEARCHABLE COMBOBOX ----------
   Mounts a fully self-contained type-to-filter picker into `container`.
   Does NOT depend on the app's render() cycle, so typing never loses focus. */
function mountSearchCombo(container, opts){
  const { options, value, placeholder, getLabel, getSub, onChange } = opts;
  const labelFor = o => getLabel ? getLabel(o) : o.name;
  const subFor = o => getSub ? (getSub(o)||'') : '';
  let selected = options.find(o => String(o.id) === String(value)) || null;
  let search = '';
  let highlighted = -1;

  container.innerHTML = `
    <div class="relative combo-root">
      <input type="text" class="combo-input w-full border rounded-lg px-3 py-2 text-sm" placeholder="${placeholder || 'Type to search...'}" autocomplete="off" value="${selected ? labelFor(selected).replace(/"/g,'&quot;') : ''}">
      <div class="combo-dropdown absolute z-20 bg-white border rounded-lg shadow-lg w-full searchDropdown hidden mt-1"></div>
    </div>`;
  const input = container.querySelector('.combo-input');
  const dropdown = container.querySelector('.combo-dropdown');

  function filtered(){
    const q = search.trim().toLowerCase();
    if(!q) return options;
    return options.filter(o => labelFor(o).toLowerCase().includes(q) || subFor(o).toLowerCase().includes(q));
  }
  function renderList(){
    const list = filtered();
    dropdown.innerHTML = list.length ? list.map((o,i)=>`
      <div class="combo-opt px-3 py-2 text-sm hover:bg-slate-100 cursor-pointer ${i===highlighted?'bg-slate-100':''}" data-idx="${i}">
        ${labelFor(o)}${subFor(o) ? `<span class="text-xs text-slate-400"> — ${subFor(o)}</span>` : ''}
      </div>`).join('') : '<div class="px-3 py-2 text-sm text-slate-400">No results</div>';
    dropdown.querySelectorAll('.combo-opt').forEach(el=>{
      el.addEventListener('mousedown', (e)=>{ e.preventDefault(); choose(list[Number(el.dataset.idx)]); });
    });
  }
  function open(){ highlighted=-1; renderList(); dropdown.classList.remove('hidden'); }
  function close(){ dropdown.classList.add('hidden'); }
  function choose(o){
    selected = o || null; search=''; highlighted=-1;
    input.value = o ? labelFor(o) : '';
    close();
    onChange(o ? o.id : '');
  }

  input.addEventListener('focus', open);
  input.addEventListener('input', ()=>{ search = input.value; selected=null; onChange(''); open(); });
  input.addEventListener('keydown', (e)=>{
    const list = filtered();
    if(e.key==='ArrowDown'){ e.preventDefault(); highlighted = Math.min(list.length-1, highlighted+1); renderList(); dropdown.classList.remove('hidden'); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); highlighted = Math.max(0, highlighted-1); renderList(); dropdown.classList.remove('hidden'); }
    else if(e.key==='Enter'){ e.preventDefault(); if(list[highlighted]) choose(list[highlighted]); }
    else if(e.key==='Escape'){ close(); }
  });
  document.addEventListener('mousedown', (e)=>{ if(!container.contains(e.target)) close(); });

  return {
    getValue: ()=> selected ? selected.id : '',
    setOptions: (opts2)=>{ opts.options.length=0; opts.options.push(...opts2); renderList(); }
  };
}

function render(){
  renderNav();
  document.getElementById('pageTitle').textContent = TABS.find(t=>t.id===currentTab).label;
  document.getElementById('todayDate').textContent = 'A.D. ' + todayISO() + '  |  B.S. ' + adToBsApprox(todayISO());
  const c = document.getElementById('content');
  switch(currentTab){
    case 'dashboard': c.innerHTML = renderDashboard(); break;
    case 'sales': c.innerHTML = renderSales(); break;
    case 'purchases': c.innerHTML = renderPurchases(); break;
    case 'journal': c.innerHTML = renderJournal(); break;
    case 'transfer': c.innerHTML = renderTransfer(); break;
    case 'parties': c.innerHTML = currentPartyView ? renderPartyDetail() : renderParties(); break;
    case 'ledgers': c.innerHTML = renderLedgers(); break;
    case 'inventory': c.innerHTML = renderInventory(); break;
    case 'receiptspayments': c.innerHTML = renderReceiptsPayments(); break;
    case 'budget': c.innerHTML = renderBudget(); break;
    case 'reports': c.innerHTML = renderReports(); break;
    case 'settings': c.innerHTML = renderSettings(); break;
  }
  lucide.createIcons();
  attachTabHandlers();
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const cash = getAccountBalance('CASH').net + getAccountBalance('BANK').net;
  const arTotal = DB.customers.reduce((s,c)=>s+Math.max(customerBalance(c.id),0),0);
  const apTotal = DB.vendors.reduce((s,v)=>s+Math.max(vendorBalance(v.id),0),0);
  const salesTotal = getAccountBalance('SALES').credit;
  const purchTotal = getAccountBalance('PURCH').debit;
  const expTotal = getAccountBalance('EXP').debit;
  const netProfit = salesTotal - purchTotal - expTotal;
  const invValue = DB.items.reduce((s,i)=>s+i.qty*i.rate,0);
  const lowStock = DB.items.filter(i=>i.qty < 10);
  const recentVouchers = [...DB.vouchers].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);

  const today = todayISO();
  const overdue = DB.vouchers.filter(v=>v.type==='Sale' && v.partyId!=='WALKIN' && v.dueDate && v.dueDate<today && customerBalance(v.partyId)>0);

  const topDebtors = DB.customers.map(c=>({...c, bal:customerBalance(c.id)})).filter(c=>c.bal>0.005).sort((a,b)=>b.bal-a.bal).slice(0,6);
  const topCreditors = DB.vendors.map(v=>({...v, bal:vendorBalance(v.id)})).filter(v=>v.bal>0.005).sort((a,b)=>b.bal-a.bal).slice(0,6);

  const cards = [
    {label:'Cash & Bank Balance', val:fmt(cash), icon:'wallet', color:'text-emerald-600 bg-emerald-50'},
    {label:'Total Receivables (Due to us)', val:fmt(arTotal), icon:'arrow-down-circle', color:'text-red-600 bg-red-50'},
    {label:'Total Payables (Due by us)', val:fmt(apTotal), icon:'arrow-up-circle', color:'text-red-600 bg-red-50'},
    {label:'Net Profit / Loss', val:fmt(netProfit), icon:'trending-up', color: (netProfit>=0?'text-emerald-600 bg-emerald-50':'text-red-600 bg-red-50')},
    {label:'Inventory Value', val:fmt(invValue), icon:'package', color:'text-purple-600 bg-purple-50'},
    {label:'Total Vouchers', val: DB.vouchers.length, icon:'file-text', color:'text-slate-600 bg-slate-100'},
  ];

  return `
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4 mb-6">  
    ${cards.map(c=>`
      <div class="bg-white rounded-xl shadow-sm border p-3 sm:p-4 flex items-center gap-3 sm:gap-4">
        <div class="p-2 sm:p-3 rounded-lg ${c.color}"><i data-lucide="${c.icon}" class="w-5 h-5 sm:w-6 sm:h-6"></i></div>
        <div class="min-w-0"><div class="text-xs text-slate-500 truncate">${c.label}</div><div class="text-base sm:text-lg font-bold truncate">${c.val}</div></div>
      </div>`).join('')}
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
    <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border p-4">
      
      <h3 class="font-semibold mb-3 flex items-center gap-2"><i data-lucide="history" class="w-4 h-4"></i> Recent Vouchers</h3>

<!-- Mobile: stacked cards -->
<div class="card-list space-y-2">
  ${recentVouchers.length? recentVouchers.map(v=>{
    const amt = v.total!==undefined ? v.total : v.entries.reduce((s,e)=>s+(e.debit||0),0);
    return `<div class="border rounded-lg p-3 flex items-center justify-between">
      <div class="min-w-0">
        <div class="text-sm font-medium">${v.billNo||v.id}</div>
        <div class="text-xs text-slate-500">${v.date} · <span class="px-1.5 py-0.5 rounded bg-slate-100">${v.type}</span></div>
      </div>
      <div class="font-semibold text-right shrink-0 ml-2">${fmt(amt)}</div>
    </div>`;
  }).join('') : '<div class="text-center py-6 text-slate-400">No vouchers yet — start by creating a Sale, Purchase, or Journal entry.</div>'}
</div>

<table class="w-full text-sm">
  <thead><tr class="text-left text-slate-500 border-b"><th class="py-2">Date</th><th>Bill/Ref</th><th>Type</th><th class="text-right">Amount</th></tr></thead>
  <tbody>

/* Shared helper for search+date filtering of a voucher list (Sales/Purchases history panels) */
function filterVoucherList(list, search, from, to){
  const q = (search||'').trim().toLowerCase();
  return list.filter(v=>{
    if(from && v.date < from) return false;
    if(to && v.date > to) return false;
    if(q){
      const hay = [v.billNo||v.id, partyName(v), (v.items||[]).map(it=>it.name).join(' ')].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* Shared search + date-range filter bar markup, mirroring the Reports date-filter pattern */
function historyFilterBar(prefix, search, from, to){
  return `
  <div class="mb-3 space-y-2">
    <input id="${prefix}SearchInput" value="${search}" placeholder="Search bill no, party, or item..." class="w-full border rounded-lg px-3 py-2 text-sm">
    <div class="flex items-center gap-2 flex-wrap">
      <label class="text-xs text-slate-500">From:</label><input type="date" id="${prefix}FromDate" value="${from}" class="border rounded px-2 py-1 text-xs">
      <label class="text-xs text-slate-500">To:</label><input type="date" id="${prefix}ToDate" value="${to}" class="border rounded px-2 py-1 text-xs">
      <button id="${prefix}FilterResetBtn" class="text-xs px-2 py-1 rounded border">Reset</button>
    </div>
  </div>`;
}
function bindHistoryFilterBar(prefix, apply, reset){
  const searchInput = document.getElementById(prefix+'SearchInput');
  const fromInput = document.getElementById(prefix+'FromDate');
  const toInput = document.getElementById(prefix+'ToDate');
  if(searchInput) searchInput.addEventListener('input', ()=>{ apply(searchInput.value, fromInput.value, toInput.value); });
  if(fromInput) fromInput.addEventListener('change', ()=>{ apply(searchInput.value, fromInput.value, toInput.value); });
  if(toInput) toInput.addEventListener('change', ()=>{ apply(searchInput.value, fromInput.value, toInput.value); });
  const resetBtn = document.getElementById(prefix+'FilterResetBtn');
  if(resetBtn) resetBtn.addEventListener('click', reset);
}
function partyName(v){
  if(v.partyId==='WALKIN') return 'Walk-in Customer';
  const list = v.partyType==='customer'?DB.customers:DB.vendors;
  const p = list.find(x=>x.id===v.partyId);
  return p ? p.name : 'Unknown';
}

/* ================= RECEIPTS & PAYMENTS REGISTER ================= */
function getReceiptsPayments(){
  return DB.vouchers.filter(v=>v.type==='Receipt' || v.type==='Payment').map(v=>{
    const cashEntry = v.entries.find(e=>e.account==='CASH' || e.account==='BANK');
    const partyEntry = v.entries.find(e=>e.party);
    let partyLabel = '—';
    if(partyEntry){
      const list = v.type==='Receipt' ? DB.customers : DB.vendors;
      const p = list.find(x=>x.id===partyEntry.party);
      partyLabel = p ? p.name : 'Unknown';
    }
    return {
      id: v.id, date: v.date, type: v.type, billNo: v.billNo||v.id,
      party: partyLabel, amount: v.type==='Receipt' ? (cashEntry?cashEntry.debit:0) : (cashEntry?cashEntry.credit:0),
      mode: cashEntry ? accountName(cashEntry.account) : '', narration: v.narration||''
    };
  }).sort((a,b)=> b.date.localeCompare(a.date));
}
function filterReceiptsPayments(list, search, from, to){
  const q = (search||'').trim().toLowerCase();
  return list.filter(r=>{
    if(from && r.date < from) return false;
    if(to && r.date > to) return false;
    if(q && !r.party.toLowerCase().includes(q) && !r.billNo.toLowerCase().includes(q)) return false;
    return true;
  });
}
function renderReceiptsPayments(){
  const filtered = filterReceiptsPayments(getReceiptsPayments(), rpSearch, rpFrom, rpTo);
  return `
  <div class="bg-white rounded-xl shadow-sm border p-4">
    <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
      <h3 class="font-semibold">Receipts & Payments Register</h3>
      <button id="rpPrintBtn" class="text-sm px-3 py-1.5 rounded-lg border flex items-center gap-1"><i data-lucide="printer" class="w-4 h-4"></i>Print</button>
    </div>
    <div class="mb-3 space-y-2">
      <input id="rpSearchInput" value="${rpSearch}" placeholder="Search by party or reference..." class="w-full sm:max-w-md border rounded-lg px-3 py-2 text-sm">
      <div class="flex items-center gap-2 flex-wrap">
        <label class="text-xs text-slate-500">From:</label><input type="date" id="rpFromDate" value="${rpFrom}" class="border rounded px-2 py-1 text-xs">
        <label class="text-xs text-slate-500">To:</label><input type="date" id="rpToDate" value="${rpTo}" class="border rounded px-2 py-1 text-xs">
        <button id="rpFilterResetBtn" class="text-xs px-2 py-1 rounded border">Reset</button>
      </div>
    </div>

    <div class="table-scroll">
    <table class="w-full text-sm">
      <thead><tr class="text-left text-slate-500 border-b"><th class="py-2">Date</th><th>Type</th><th>Party</th><th>Mode</th><th>Reference/Narration</th><th class="text-right">Amount</th></tr></thead>
      <tbody id="rpTableBody">${rpRowsHtml(filtered)}</tbody>
    </table>
    </div>
  </div>`;
}
function rpTotalsHtml(list){
  const totalReceipts = list.filter(r=>r.type==='Receipt').reduce((s,r)=>s+r.amount,0);
  const totalPayments = list.filter(r=>r.type==='Payment').reduce((s,r)=>s+r.amount,0);
  return `<span class="text-emerald-600">Total Receipts: ${fmt(totalReceipts)}</span> &nbsp;·&nbsp; <span class="text-red-600">Total Payments: ${fmt(totalPayments)}</span>`;

function rpRowsHtml(list){
  return list.length ? list.map(r=>`
    <tr class="border-b">
      <td class="py-2">${r.date}</td>
      <td><span class="px-2 py-0.5 rounded text-xs ${r.type==='Receipt'?'bg-emerald-50 text-emerald-600':'bg-red-50 text-red-600'}">${r.type}</span></td>
      <td>${r.party}</td><td>${r.mode}</td><td>${r.billNo}${r.narration?' — '+r.narration:''}</td>

function bindReceiptsPaymentsHandlers(){
  function apply(){
    rpSearch = document.getElementById('rpSearchInput').value;

    document.getElementById('rpTableBody').innerHTML = rpRowsHtml(filtered);
    document.getElementById('rpTotalsBar').innerHTML = rpTotalsHtml(filtered);

  document.getElementById('rpSearchInput').addEventListener('input', apply);

function renderBudget(){
  const expAccounts = DB.accounts.filter(a=>a.type==='Expense');
  const now = new Date();
  const curMonth = now.toISOString().slice(0,7);
  const curYear = String(now.getFullYear());

  const rows = DB.budgets.map(b=>{

    } else {
      actual = getAccountBalance(b.account, b.year+'-01-01', b.year+'-12-31').debit;
    }
    const pct = b.amount>0 ? Math.min(200, (actual/b.amount*100)) : 0;
    let barColor = 'bg-emerald-500';

  return `

        </select>

      <div><label class="text-xs text-slate-500">Target Amount</label><input id="budgetAmount" type="number" min="0" step="0.01" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
      <button id="addBudgetBtn" class="btn-primary px-3 py-2 rounded-lg text-sm">Add Budget</button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    ${rows.length? rows.map(b=>`
      <div class="bg-white rounded-xl shadow-sm border p-4">
        <div class="flex justify-between text-sm mb-2">
          <span class="font-medium">${accountName(b.account)} <span class="text-xs text-slate-400">(${b.period==='monthly'?b.month:b.year})</span></span>
          <span>${fmt(b.actual)} / ${fmt(b.amount)}</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2.5 mb-1">
          <div class="${b.barColor} h-2.5 rounded-full" style="width:${Math.min(100,b.pct)}%"></div>
        </div>
        <div class="text-xs ${b.pct>=100?'text-red-600':b.pct>=80?'text-amber-600':'text-slate-500'}">${b.pct.toFixed(0)}% used ${b.pct>=100?'— Over budget!':b.pct>=80?'— Approaching limit':''}</div>

    const rows = filterVouchers(reportFrom, reportTo).sort((a,b)=>a.date.localeCompare(b.date));

      <div class="table-scroll"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 border-b"><th class="py-2">Date</th><th>Ref</th><th>Type</th><th>Narration</th><th class="text-right">Amount</th></tr></thead>
      <tbody>
      ${rows.map(v=>{
        const amt = v.entries.reduce((s,e)=>s+(e.debit||0),0);
        return `<tr class="border-b"><td class="py-2">${v.date}</td><td>${v.billNo||v.id}</td><td><span class="px-2 py-0.5 rounded text-xs bg-slate-100">${v.type}</span></td><td>${v.narration||partyName(v)}</td><td class="text-right">${fmt(amt)}</td></tr>`;
      }).join('') || '<tr><td colspan="5" class="text-center py-6 text-slate-400">No vouchers</td></tr>'}
      </tbody></table></div>`;
    bindReportDateFilter('daybook');
  }
  else if(type==='trial'){
    let totalD=0, totalC=0;
    const rows = DB.accounts.map(a=>{
      const b = getAccountBalance(a.id, reportFrom, reportTo);
      totalD += b.debit; totalC += b.credit;
      return {name:a.name, type:a.type, debit:b.debit, credit:b.credit};
    });
    body.innerHTML = dateFilterBar('trial') + `
      <div class="table-scroll"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 border-b"><th class="py-2">Account</th><th>Type</th><th class="text-right">Debit</th><th class="text-right">Credit</th></tr></thead>
      <tbody>
      ${rows.map(r=>`<tr class="border-b"><td class="py-2">${r.name}</td><td class="text-xs text-slate-500">${r.type}</td><td class="text-right">${r.debit?fmt(r.debit):'-'}</td><td class="text-right">${r.credit?fmt(r.credit):'-'}</td></tr>`).join('')}
      </tbody>
      <tfoot><tr class="font-bold border-t"><td class="py-2" colspan="2">Total</td><td class="text-right">${fmt(totalD)}</td><td class="text-right">${fmt(totalC)}</td></tr></tfoot>
      </table></div>
      <div class="mt-3 text-sm ${Math.abs(totalD-totalC)<0.01?'text-emerald-600':'text-red-600'} font-medium flex items-center gap-1">
        <i data-lucide="${Math.abs(totalD-totalC)<0.01?'check-circle':'alert-triangle'}" class="w-4 h-4"></i>
        ${Math.abs(totalD-totalC)<0.01?'Trial Balance is balanced.':'Trial Balance mismatch!'}
      </div>`;
    bindReportDateFilter('trial');
    lucide.createIcons();
  }
  else if(type==='pnl'){
    const revenue = getAccountBalance('SALES', reportFrom, reportTo).credit;
    const purchases = getAccountBalance('PURCH', reportFrom, reportTo).debit;
    const expenses = getAccountBalance('EXP', reportFrom, reportTo).debit;
    const net = revenue - purchases - expenses;
    body.innerHTML = dateFilterBar('pnl') + `
      <div class="table-scroll"><table class="w-full text-sm max-w-lg">
        <tr class="border-b"><td class="py-2">Revenue — Sales</td><td class="text-right font-medium">${fmt(revenue)}</td></tr>
        <tr class="border-b"><td class="py-2">Less: Cost of Goods (Purchases)</td><td class="text-right font-medium">(${fmt(purchases)})</td></tr>
        <tr class="border-b"><td class="py-2">Less: General Expenses</td><td class="text-right font-medium">(${fmt(expenses)})</td></tr>
        <tr class="font-bold text-base border-t"><td class="py-3">Net ${net>=0?'Profit':'Loss'}</td><td class="text-right ${net>=0?'text-emerald-600':'text-red-600'}">${fmt(Math.abs(net))}</td></tr>
      </table></div>`;
    bindReportDateFilter('pnl');
  }
  else if(type==='balancesheet'){
    const asOf = reportTo || todayISO();
    const groups = {Asset:[], Liability:[], Equity:[]};
    DB.accounts.forEach(a=>{
      if(!groups[a.type]) return; // Revenue/Expense accounts aren't part of the balance sheet
      const bal = getAccountBalance(a.id, '', asOf).net;
      groups[a.type].push({name:a.name, bal});
    });
    // Retained earnings (current period P&L) rolled into Equity so the sheet balances.
    const revenue = getAccountBalance('SALES', '', asOf).credit;
    const purchases = getAccountBalance('PURCH', '', asOf).debit;
    const expenses = getAccountBalance('EXP', '', asOf).debit;
    const retainedEarnings = revenue - purchases - expenses;
    groups.Equity.push({name:'Retained Earnings (Net Profit/Loss to date)', bal: retainedEarnings});

    const totalAssets = groups.Asset.reduce((s,a)=>s+a.bal, 0);
    const totalLiabilities = groups.Liability.reduce((s,a)=>s+a.bal, 0);
    const totalEquity = groups.Equity.reduce((s,a)=>s+a.bal, 0);
    const balanced = Math.abs(totalAssets - (totalLiabilities + totalEquity)) < 0.01;

    const groupTable = (label, rows, total)=> `
      <div class="mb-4">
        <div class="font-semibold text-sm mb-1">${label}</div>
        <div class="table-scroll"><table class="w-full text-sm">
          <tbody>
          ${rows.length ? rows.map(r=>`<tr class="border-b"><td class="py-1.5">${r.name}</td><td class="text-right py-1.5">${fmt(Math.abs(r.bal))}</td></tr>`).join('') : '<tr><td class="py-1.5 text-slate-400" colspan="2">No accounts</td></tr>'}
          </tbody>
          <tfoot><tr class="font-semibold border-t"><td class="py-2">Total ${label}</td><td class="text-right">${fmt(Math.abs(total))}</td></tr></tfoot>
        </table></div>
      </div>`;

    body.innerHTML = `
      <div class="flex items-center gap-2 mb-3 flex-wrap">
        <label class="text-sm">As of:</label><input type="date" id="bsAsOfDate" value="${asOf}" class="border rounded px-2 py-1 text-sm">
        <button id="bsFilterBtn" class="bg-slate-800 text-white text-sm px-3 py-1.5 rounded-lg">Apply</button>
        <button id="bsResetBtn" class="text-sm px-3 py-1.5 rounded-lg border">Reset</button>
        <button id="bsPrintBtn" class="text-sm px-3 py-1.5 rounded-lg border flex items-center gap-1 ml-auto"><i data-lucide="printer" class="w-4 h-4"></i>Print</button>
      </div>
      <div id="balanceSheetBody">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            ${groupTable('Assets', groups.Asset, totalAssets)}
          </div>
          <div>
            ${groupTable('Liabilities', groups.Liability, totalLiabilities)}
            ${groupTable('Equity', groups.Equity, totalEquity)}
          </div>
        </div>
        <div class="mt-2 text-sm ${balanced?'text-emerald-600':'text-red-600'} font-medium flex items-center gap-1">
          <i data-lucide="${balanced?'check-circle':'alert-triangle'}" class="w-4 h-4"></i>
          ${balanced ? `Balanced: Assets (${fmt(totalAssets)}) = Liabilities + Equity (${fmt(totalLiabilities+totalEquity)})` : `Mismatch: Assets (${fmt(totalAssets)}) ≠ Liabilities + Equity (${fmt(totalLiabilities+totalEquity)})`}
        </div>
      </div>`;
    document.getElementById('bsFilterBtn').addEventListener('click', ()=>{ reportTo = document.getElementById('bsAsOfDate').value; renderReportBody('balancesheet'); });
    document.getElementById('bsResetBtn').addEventListener('click', ()=>{ reportTo=''; renderReportBody('balancesheet'); });
    document.getElementById('bsPrintBtn').addEventListener('click', ()=> printBalanceSheet(asOf, groups, totalAssets, totalLiabilities, totalEquity, balanced));
    lucide.createIcons();
  }
  else if(type==='monthly'){
    const months = {};
    DB.vouchers.forEach(v=>{
      const m = v.date.slice(0,7);
      if(!months[m]) months[m] = {sales:0, purchases:0, expenses:0};
    });
    Object.keys(months).forEach(m=>{
      months[m].sales = getAccountBalance('SALES', m+'-01', m+'-31').credit;
      months[m].purchases = getAccountBalance('PURCH', m+'-01', m+'-31').debit;
      months[m].expenses = getAccountBalance('EXP', m+'-01', m+'-31').debit;
    });
    const sortedMonths = Object.keys(months).sort();
    body.innerHTML = `
      <div class="table-scroll"><table class="w-full text-sm">
        <thead><tr class="text-left text-slate-500 border-b"><th class="py-2">Month</th><th class="text-right">Sales</th><th class="text-right">Purchases</th><th class="text-right">Expenses</th><th class="text-right">Net Profit</th></tr></thead>
        <tbody>
        ${sortedMonths.length? sortedMonths.map(m=>{
          const net = months[m].sales - months[m].purchases - months[m].expenses;
          return `<tr class="border-b"><td class="py-2">${m}</td><td class="text-right">${fmt(months[m].sales)}</td><td class="text-right">${fmt(months[m].purchases)}</td><td class="text-right">${fmt(months[m].expenses)}</td><td class="text-right font-medium ${net>=0?'text-emerald-600':'text-red-600'}">${fmt(net)}</td></tr>`;
        }).join('') : '<tr><td colspan="5" class="text-center py-6 text-slate-400">No data yet</td></tr>'}
        </tbody>
      </table></div>`;
  }
}
function bindReportDateFilter(prefix){
  const filterBtn = document.getElementById(prefix+'FilterBtn');
  const resetBtn = document.getElementById(prefix+'ResetBtn');
  if(filterBtn) filterBtn.addEventListener('click', ()=>{
    reportFrom = document.getElementById(prefix+'From').value;
    reportTo = document.getElementById(prefix+'To').value;
    renderReportBody(prefix);
  });
  if(resetBtn) resetBtn.addEventListener('click', ()=>{ reportFrom=''; reportTo=''; renderReportBody(prefix); });
}

/* ---- SALES ---- */
let saleCustomerCombo = null, saleItemCombo = null;
function bindSalesHandlers(){
  if(DB.items.length===0) return;

  const activeCustomers = DB.customers.filter(c=>c.active!==false);
  saleCustomerCombo = mountSearchCombo(document.getElementById('saleCustomerCombo'), {
    options: [{id:'WALKIN', name:'Walk-in Cash Customer', pan:''}, ...activeCustomers],
    value: 'WALKIN',
    placeholder: 'Type to search customer...',
    getLabel: o=>o.name,
    getSub: o=>o.pan,
    onChange: ()=>{}
  });

  const rateInput = document.getElementById('saleRate');
  function syncRate(itemId){ const it = DB.items.find(i=>i.id===itemId); if(it) rateInput.value = it.rate; }
  saleItemCombo = mountSearchCombo(document.getElementById('saleItemCombo'), {
    options: DB.items,
    value: DB.items[0] ? DB.items[0].id : '',
    placeholder: 'Type to search item...',
    getLabel: o=>o.name,
    getSub: o=>`stock: ${o.qty}`,
    onChange: (id)=>{ if(id) syncRate(id); }
  });
  if(DB.items[0]) syncRate(DB.items[0].id);

  document.getElementById('addSaleLine').addEventListener('click', ()=>{
    const itemId = saleItemCombo.getValue();
    const item = DB.items.find(i=>i.id===itemId);
    if(!item){ toast('Select an item first','warning'); return; }
    const qty = Number(document.getElementById('saleQty').value);
    const rate = Number(document.getElementById('saleRate').value);
    const discount = Number(document.getElementById('saleDiscount').value)||0;
    if(!qty || qty<=0){ toast('Enter a valid quantity','warning'); return; }
    const alreadyInCart = currentSaleCart.filter(l=>l.itemId===itemId).reduce((s,l)=>s+l.qty,0);
    if(qty + alreadyInCart > item.qty){ toast(`Insufficient stock for ${item.name}. Available: ${item.qty}`,'error'); return; }
    currentSaleCart.push({itemId, name:item.name, qty, rate, discount});
    render();
  });
  document.querySelectorAll('.removeSaleLine').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentSaleCart.splice(Number(btn.dataset.idx),1); render(); });
  });
  document.getElementById('clearSale').addEventListener('click', ()=>{ currentSaleCart=[]; render(); });
  document.getElementById('vatToggle').addEventListener('change', (e)=>{
    const sub = currentSaleCart.reduce((s,l)=>s+l.qty*l.rate-(l.discount||0),0);
    const vat = e.target.checked ? +(sub*0.13).toFixed(2) : 0;
    document.getElementById('vatLine').style.display = e.target.checked ? '' : 'none';
    document.getElementById('saleGrandTotal').textContent = fmt(sub+vat);
  });

  document.getElementById('saveSale').addEventListener('click', ()=>{
    if(currentSaleCart.length===0){ toast('Add at least one item to the invoice','warning'); return; }
    const custId = saleCustomerCombo.getValue() || 'WALKIN';
    const date = document.getElementById('saleDate').value || todayISO();
    const dueDate = document.getElementById('saleDueDate').value || null;
    const applyVat = document.getElementById('vatToggle').checked;
    const sub = currentSaleCart.reduce((s,l)=>s+l.qty*l.rate-(l.discount||0),0);
    const vat = applyVat ? +(sub*0.13).toFixed(2) : 0;
    const total = +(sub+vat).toFixed(2);

    for(const l of currentSaleCart){
      const item = DB.items.find(i=>i.id===l.itemId);
      if(l.qty > item.qty){ toast(`Insufficient stock for ${item.name}`,'error'); return; }
    }

    const entries = [];
    if(custId==='WALKIN'){
      entries.push({account:'CASH', debit:total, credit:0});
    } else {
      entries.push({account:'AR', debit:total, credit:0, party:custId});
    }
    entries.push({account:'SALES', debit:0, credit:sub});
    if(vat>0) entries.push({account:'VAT', debit:0, credit:vat});

    DB.billCounter++;
    const voucher = {
      id: uid('V'), type:'Sale', date, dueDate, billNo:'INV-'+DB.billCounter,
      partyId:custId, partyType:'customer',
      items: currentSaleCart.map(l=>({itemId:l.itemId, name:l.name, qty:l.qty, rate:l.rate, discount:l.discount, amount:l.qty*l.rate-(l.discount||0)})),
      subtotal:sub, vat, total, vatApplied:applyVat,
      entries, narration:'Sales invoice'
    };
    try{
      postVoucher(voucher);
      currentSaleCart.forEach(l=>{ const item = DB.items.find(i=>i.id===l.itemId); item.qty -= l.qty; });
      saveDB();
      toast('Invoice '+voucher.billNo+' posted successfully','success');
      currentSaleCart = [];
      render();
      printInvoice(voucher);
    }catch(err){ toast(err.message,'error'); }
  });

  document.querySelectorAll('.printSaleBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const v = DB.vouchers.find(x=>x.id===btn.dataset.vid);
      printInvoice(v);
    });
  });

  bindHistoryFilterBar('sales',
    (s,f,t)=>{ salesSearch=s; salesFrom=f; salesTo=t; refreshSalesHistoryPanel(); },
    ()=>{ salesSearch=''; salesFrom=''; salesTo=''; render(); }
  );
}
function refreshSalesHistoryPanel(){
  // Update only the history list (not the whole form) so typing in the search box keeps focus.
  const filtered = filterVoucherList(DB.vouchers.filter(v=>v.type==='Sale'), salesSearch, salesFrom, salesTo);
  const list = document.getElementById('salesHistoryList');
  if(!list) return;
  list.innerHTML = filtered.slice().reverse().map(v=>`
    <div class="border rounded-lg p-3 text-sm flex justify-between items-center gap-2">
      <div class="min-w-0">
        <div class="font-medium truncate">${v.billNo}</div>
        <div class="text-xs text-slate-500 truncate">${v.date} · ${partyName(v)}</div>
      </div>
      <div class="text-right flex-shrink-0">
        <div class="font-bold">${fmt(v.total)}</div>
        <button data-vid="${v.id}" class="printSaleBtn text-sm mt-1 py-1 px-1" style="color:var(--accent)"><i data-lucide="printer" class="w-3 h-3 inline"></i> Print</button>
      </div>
    </div>`).join('') || '<p class="text-slate-400 text-sm">No sales match your filters.</p>';
  lucide.createIcons();
  list.querySelectorAll('.printSaleBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ printInvoice(DB.vouchers.find(x=>x.id===btn.dataset.vid)); });
  });
}

/* ---- PURCHASES ---- */
let purchVendorCombo = null, purchItemCombo = null;
function bindPurchaseHandlers(){
  const comboHost = document.getElementById('purchItemCombo');
  if(!comboHost) return;

  const activeVendors = DB.vendors.filter(v=>v.active!==false);
  purchVendorCombo = mountSearchCombo(document.getElementById('purchVendorCombo'), {
    options: activeVendors,
    value: activeVendors[0] ? activeVendors[0].id : '',
    placeholder: 'Type to search vendor...',
    getLabel: o=>o.name,
    getSub: o=>o.pan,
    onChange: ()=>{}
  });

  const rateInput = document.getElementById('purchRate');
  function syncRate(itemId){ const it = DB.items.find(i=>i.id===itemId); if(it) rateInput.value = it.rate; }
  purchItemCombo = mountSearchCombo(comboHost, {
    options: DB.items,
    value: DB.items[0] ? DB.items[0].id : '',
    placeholder: 'Type to search item...',
    getLabel: o=>o.name,
    getSub: o=>`stock: ${o.qty}`,
    onChange: (id)=>{ if(id) syncRate(id); }
  });
  if(DB.items[0]) syncRate(DB.items[0].id);

  document.getElementById('addPurchLine').addEventListener('click', ()=>{
    const itemId = purchItemCombo.getValue();
    const item = DB.items.find(i=>i.id===itemId);
    if(!item){ toast('Select an item first','warning'); return; }
    const qty = Number(document.getElementById('purchQty').value);
    const rate = Number(document.getElementById('purchRate').value);
    if(!qty || qty<=0){ toast('Enter a valid quantity','warning'); return; }
    currentPurchaseCart.push({itemId, name:item.name, qty, rate});
    render();
  });
  document.querySelectorAll('.removePurchLine').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentPurchaseCart.splice(Number(btn.dataset.idx),1); render(); });
  });
  document.getElementById('clearPurchase').addEventListener('click', ()=>{ currentPurchaseCart=[]; render(); });

  document.getElementById('savePurchase').addEventListener('click', ()=>{
    if(currentPurchaseCart.length===0){ toast('Add at least one item','warning'); return; }
    const vendId = purchVendorCombo.getValue();
    if(!vendId){ toast('Select a vendor','warning'); return; }
    const date = document.getElementById('purchDate').value || todayISO();
    const applyVat = document.getElementById('purchVatToggle').checked;
    const sub = currentPurchaseCart.reduce((s,l)=>s+l.qty*l.rate,0);
    const vat = applyVat ? +(sub*0.13).toFixed(2) : 0;
    const total = +(sub+vat).toFixed(2);

    const entries = [ {account:'PURCH', debit:sub, credit:0} ];
    if(vat>0) entries.push({account:'VAT', debit:vat, credit:0});
    entries.push({account:'AP', debit:0, credit:total, party:vendId});

    DB.billCounter++;
    const voucher = {
      id: uid('V'), type:'Purchase', date, billNo:'PUR-'+DB.billCounter,
      partyId:vendId, partyType:'vendor',
      items: currentPurchaseCart.map(l=>({itemId:l.itemId, name:l.name, qty:l.qty, rate:l.rate, amount:l.qty*l.rate})),
      subtotal:sub, vat, total, vatApplied:applyVat,
      entries, narration:'Purchase entry'
    };
    try{
      postVoucher(voucher);
      currentPurchaseCart.forEach(l=>{ const item = DB.items.find(i=>i.id===l.itemId); item.qty += l.qty; });
      saveDB();
      toast('Purchase '+voucher.billNo+' posted successfully','success');
      currentPurchaseCart = [];
      render();
    }catch(err){ toast(err.message,'error'); }
  });

  bindHistoryFilterBar('purch',
    (s,f,t)=>{ purchSearch=s; purchFrom=f; purchTo=t; refreshPurchHistoryPanel(); },
    ()=>{ purchSearch=''; purchFrom=''; purchTo=''; render(); }
  );
}
function refreshPurchHistoryPanel(){
  const filtered = filterVoucherList(DB.vouchers.filter(v=>v.type==='Purchase'), purchSearch, purchFrom, purchTo);
  const list = document.getElementById('purchHistoryList');
  if(!list) return;
  list.innerHTML = filtered.slice().reverse().map(v=>`
    <div class="border rounded-lg p-3 text-sm flex justify-between items-center gap-2">
      <div class="min-w-0"><div class="font-medium truncate">${v.billNo}</div><div class="text-xs text-slate-500 truncate">${v.date} · ${partyName(v)}</div></div>
      <div class="font-bold flex-shrink-0">${fmt(v.total)}</div>
    </div>`).join('') || '<p class="text-slate-400 text-sm">No purchases match your filters.</p>';
}

/* ---- JOURNAL ---- */
function bindJournalHandlers(){
  document.querySelectorAll('.jvAccountCombo').forEach(host=>{
    const idx = Number(host.dataset.idx);
    mountSearchCombo(host, {
      options: DB.accounts,
      value: jvLines[idx].account,
      placeholder: 'Type to search account...',
      getLabel: o=>o.name,
      getSub: o=>o.type,
      onChange: (id)=>{ jvLines[idx].account = id; }
    });
  });
  document.querySelectorAll('.jvDebit').forEach(el=>el.addEventListener('input', e=>{ jvLines[e.target.dataset.idx].debit = Number(e.target.value)||0; if(Number(e.target.value)>0) jvLines[e.target.dataset.idx].credit=0; render(); }));
  document.querySelectorAll('.jvCredit').forEach(el=>el.addEventListener('input', e=>{ jvLines[e.target.dataset.idx].credit = Number(e.target.value)||0; if(Number(e.target.value)>0) jvLines[e.target.dataset.idx].debit=0; render(); }));
  document.querySelectorAll('.jvRemoveRow').forEach(el=>el.addEventListener('click', e=>{
    const idx = Number(e.currentTarget.dataset.idx);
    if(jvLines.length<=2){ toast('A journal voucher needs at least 2 lines','warning'); return; }
    jvLines.splice(idx,1); render();
  }));
  document.getElementById('jvAddRow').addEventListener('click', ()=>{ jvLines.push({account:'',debit:0,credit:0}); render(); });

  const postBtn = document.getElementById('postJV');
  if(postBtn) postBtn.addEventListener('click', ()=>{
    const date = document.getElementById('jvDate').value || todayISO();
    const narration = document.getElementById('jvNarration').value || 'Manual Journal Entry';
    const cleanLines = jvLines.filter(l=>l.account && (l.debit>0 || l.credit>0));
    if(cleanLines.length<2){ toast('Add at least two valid account lines','warning'); return; }
    const totalD = cleanLines.reduce((s,l)=>s+(l.debit||0),0);
    const totalC = cleanLines.reduce((s,l)=>s+(l.credit||0),0);
    if(Math.abs(totalD-totalC)>0.005){ toast('Debits and Credits must be equal','error'); return; }
    DB.jvCounter++;
    const voucher = { id: uid('V'), type:'Journal', date, billNo:'JV-'+DB.jvCounter, entries: cleanLines.map(l=>({account:l.account, debit:l.debit||0, credit:l.credit||0})), narration };
    try{
      postVoucher(voucher);
      toast('Journal voucher '+voucher.billNo+' posted','success');
      jvLines = [{account:'',debit:0,credit:0},{account:'',debit:0,credit:0}];
      render();
    }catch(err){ toast(err.message,'error'); }
  });
}

/* ---- TRANSFER ---- */
let transferFromCombo = null, transferToCombo = null;
function bindTransferHandlers(){
  const fromList = DB.accounts.filter(a=> a.id!=='SALES' && a.id!=='PURCH');
  const toList = DB.accounts.filter(a=> a.id!=='SALES' && a.id!=='PURCH');
  transferFromCombo = mountSearchCombo(document.getElementById('transferFromCombo'), {
    options: fromList, value: transferFromAcc, placeholder: 'Type to search...',
    getLabel: o=>o.name, getSub: o=>o.type, onChange: (id)=>{ transferFromAcc = id; }
  });
  transferToCombo = mountSearchCombo(document.getElementById('transferToCombo'), {
    options: toList, value: transferToAcc, placeholder: 'Type to search...',
    getLabel: o=>o.name, getSub: o=>o.type, onChange: (id)=>{ transferToAcc = id; }
  });

  document.getElementById('postTransfer').addEventListener('click', ()=>{
    const fromAcc = transferFromCombo.getValue();
    const toAcc = transferToCombo.getValue();
    const amount = Number(document.getElementById('transferAmount').value);
    const date = document.getElementById('transferDate').value || todayISO();
    const note = document.getElementById('transferNote').value || 'Fund transfer';
    if(!fromAcc || !toAcc){ toast('Select both From and To accounts','warning'); return; }
    if(fromAcc===toAcc){ toast('From and To accounts must be different','warning'); return; }
    if(!amount || amount<=0){ toast('Enter a valid amount','warning'); return; }
    DB.trCounter++;
    const voucher = {
      id: uid('V'), type:'Transfer', date, billNo:'TR-'+DB.trCounter,
      entries: [ {account:toAcc, debit:amount, credit:0}, {account:fromAcc, debit:0, credit:amount} ],
      narration: note
    };
    try{
      postVoucher(voucher);
      toast('Transfer posted successfully','success');
      transferFromAcc=''; transferToAcc='';
      render();
    }catch(err){ toast(err.message,'error'); }
  });
}

  document.getElementById('recordPaymentBtn').addEventListener('click', ()=>{
    openModal(`
      <div class="p-5">
        <h3 class="font-semibold text-lg mb-4">Record ${type==='customer'?'Payment Received from':'Payment Made to'} ${p.name}</h3>

          <div><label class="text-xs text-slate-500">Via Account</label>
            <select id="payAccount" class="w-full border rounded-lg px-3 py-2 text-sm">

          </div>
        </div>
        <div class="flex gap-2 mt-5">
          <button id="savePayment" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm flex-1">Save Payment</button>
          <button id="cancelPayment" class="bg-slate-200 px-4 py-2 rounded-lg text-sm">Cancel</button>
        </div>
      </div>`);
    document.getElementById('cancelPayment').addEventListener('click', closeModal);
    document.getElementById('savePayment').addEventListener('click', ()=>{
      const amount = Number(document.getElementById('payAmount').value);
      const date = document.getElementById('payDate').value || todayISO();
      const cashAccount = document.getElementById('payAccount').value;
      if(!amount || amount<=0){ toast('Enter a valid amount','warning'); return; }
      DB.payCounter++;
      let voucher;
      if(type==='customer'){
        voucher = { id:uid('V'), type:'Receipt', date, billNo:'RCPT-'+DB.payCounter,
          entries:[ {account:cashAccount, debit:amount, credit:0}, {account:'AR', debit:0, credit:amount, party:id} ],

    window.open(`https://wa.me/${fullPhone}?text=${encodeURIComponent(msg)}`, '_blank');
  });

  document.getElementById('printStatementBtn').addEventListener('click', ()=> printPartyStatement(p, type));
}

/* ---- SETTINGS ---- */
function bindSettingsHandlers(){
  document.getElementById('saveCompany').addEventListener('click', ()=>{
    DB.company.name = document.getElementById('companyName').value;
    DB.company.pan = document.getElementById('companyPan').value;
    DB.company.address = document.getElementById('companyAddress').value;
    DB.company.fiscalYear = document.getElementById('companyFY').value;
    saveDB(); toast('Company info saved','success');
  });
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='accounting_backup.json'; a.click();
    URL.revokeObjectURL(url);
    toast('Backup exported','success');
  });
  document.getElementById('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed.accounts || !parsed.vouchers || !parsed.items){ throw new Error('Invalid backup file structure'); }
        DB = parsed; if(!DB.budgets) DB.budgets=[]; saveDB(); toast('Backup restored successfully','success'); render();
      }catch(err){ toast('Import failed: '+err.message,'error'); }
    };
    reader.readAsText(file);
  });
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    openModal(`
      <div class="p-5">
        <h3 class="font-semibold text-lg mb-2 text-red-600 flex items-center gap-2"><i data-lucide="triangle-alert" class="w-5 h-5"></i>Confirm Hard Reset</h3>
        <p class="text-sm text-slate-600 mb-4">This will permanently delete ALL data (accounts, vouchers, inventory, customers, vendors) and start clean. This action cannot be undone.</p>
        <div class="flex gap-2">

          <button id="cancelReset" class="bg-slate-200 px-4 py-2 rounded-lg text-sm">Cancel</button>
        </div>
      </div>`);
    document.getElementById('cancelReset').addEventListener('click', closeModal);
    document.getElementById('confirmReset').addEventListener('click', ()=>{
      localStorage.removeItem(DB_KEY);
      loadDB(); closeModal(); toast('System reset complete','success'); currentTab='dashboard'; render();
    });
  });
}

/* ================= PRINT PARTY STATEMENT ================= */

  const openingRows = getPartyEntries(p.id, account, '', partyFrom || '1900-01-01');
  const opening = openingRows.length ? openingRows[openingRows.length-1].balance : 0;
  let running = opening;
  const bodyRows = rows.map(r=>{ running = r.balance; return `
    <tr><td style="padding:6px;border:1px solid #ccc;">${r.date}</td><td style="padding:6px;border:1px solid #ccc;">${r.billNo}</td><td style="padding:6px;border:1px solid #ccc;">${r.type}</td>
    <td style="padding:6px;border:1px solid #ccc;text-align:right;">${r.debit?fmt(r.debit):''}</td>
    <td style="padding:6px;border:1px solid #ccc;text-align:right;">${r.credit?fmt(r.credit):''}</td>
    <td style="padding:6px;border:1px solid #ccc;text-align:right;">${fmt(Math.abs(r.balance))} ${r.balance>=0?'Dr':'Cr'}</td></tr>`;

  const closing = rows.length ? rows[rows.length-1].balance : opening;

  document.getElementById('print-area').innerHTML = `
    <div style="font-family:Arial,sans-serif;max-width:800px;margin:0 auto;padding:20px;color:#111;">
      <div style="text-align:center;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:15px;">
        <h1 style="margin:0;font-size:20px;">${DB.company.name}</h1>
        <div style="font-size:16px;font-weight:bold;margin-top:8px;">ACCOUNT STATEMENT</div>
      </div>
      <table style="width:100%;font-size:13px;margin-bottom:12px;">
        <tr><td>Party: <b>${p.name}</b></td><td style="text-align:right;">Period: <b>${partyFrom||'Beginning'} to ${partyTo||'Today'}</b></td></tr>
        <tr><td>PAN: <b>${p.pan||'-'}</b></td><td style="text-align:right;">Opening Balance: <b>${fmt(Math.abs(opening))} ${opening>=0?'Dr':'Cr'}</b></td></tr>
      </table>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="background:#eee;">
          <th style="padding:6px;border:1px solid #ccc;">Date</th><th style="padding:6px;border:1px solid #ccc;">Ref</th><th style="padding:6px;border:1px solid #ccc;">Type</th>
          <th style="padding:6px;border:1px solid #ccc;">Debit</th><th style="padding:6px;border:1px solid #ccc;">Credit</th><th style="padding:6px;border:1px solid #ccc;">Balance</th>
        </tr></thead>
        <tbody>${bodyRows || '<tr><td colspan="6" style="padding:10px;text-align:center;">No transactions in this period</td></tr>'}</tbody>
      </table>
      <table style="width:280px;margin-left:auto;margin-top:10px;font-size:14px;font-weight:bold;border-top:2px solid #333;">
        <tr><td style="padding:6px;">Closing Balance</td><td style="text-align:right;">${fmt(Math.abs(closing))} ${closing>=0?'Dr':'Cr'}</td></tr>
      </table>
    </div>`;
  window.print();
}

function printAccountStatement(accountId, accountLabel){
  const rows = getLedgerEntries(accountId, ledgerFrom, ledgerTo);
  const bal = getAccountBalance(accountId, ledgerFrom, ledgerTo);
  const bodyRows = rows.map(r=>`
    <tr><td style="padding:6px;border:1px solid #ccc;">${r.date}</td><td style="padding:6px;border:1px solid #ccc;">${r.billNo}</td><td style="padding:6px;border:1px solid #ccc;">${r.type}</td>
    <td style="padding:6px;border:1px solid #ccc;text-align:right;">${r.debit?fmt(r.debit):''}</td>
    <td style="padding:6px;border:1px solid #ccc;text-align:right;">${r.credit?fmt(r.credit):''}</td>
    <td style="padding:6px;border:1px solid #ccc;text-align:right;">${fmt(Math.abs(r.balance))} ${r.balance>=0?'Dr':'Cr'}</td></tr>`).join('');
  document.getElementById('print-area').innerHTML = `
    <div style="font-family:Arial,sans-serif;max-width:800px;margin:0 auto;padding:20px;color:#111;">
      <div style="text-align:center;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:15px;">
        <h1 style="margin:0;font-size:20px;">${DB.company.name}</h1>
        <div style="font-size:16px;font-weight:bold;margin-top:8px;">${accountLabel.toUpperCase()} — LEDGER STATEMENT</div>
        <div style="font-size:12px;">Period: ${ledgerFrom||'Beginning'} to ${ledgerTo||'Today'}</div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="background:#eee;"><th style="padding:6px;border:1px solid #ccc;">Date</th><th style="padding:6px;border:1px solid #ccc;">Ref</th><th style="padding:6px;border:1px solid #ccc;">Type</th><th style="padding:6px;border:1px solid #ccc;">Debit</th><th style="padding:6px;border:1px solid #ccc;">Credit</th><th style="padding:6px;border:1px solid #ccc;">Balance</th></tr></thead>
        <tbody>${bodyRows || '<tr><td colspan="6" style="padding:10px;text-align:center;">No transactions</td></tr>'}</tbody>
      </table>
      <table style="width:280px;margin-left:auto;margin-top:10px;font-size:14px;font-weight:bold;border-top:2px solid #333;">
        <tr><td style="padding:6px;">Closing Balance</td><td style="text-align:right;">${fmt(Math.abs(bal.net))} ${bal.net>=0?'Dr':'Cr'}</td></tr>
      </table>
    </div>`;
  window.print();
}

/* ================= PRINT BALANCE SHEET ================= */
function printBalanceSheet(asOf, groups, totalAssets, totalLiabilities, totalEquity, balanced){
  const rowsHtml = (rows)=> rows.map(r=>`<tr><td style="padding:5px;border:1px solid #ccc;">${r.name}</td><td style="padding:5px;border:1px solid #ccc;text-align:right;">${fmt(Math.abs(r.bal))}</td></tr>`).join('');
  document.getElementById('print-area').innerHTML = `
    <div style="font-family:Arial,sans-serif;max-width:800px;margin:0 auto;padding:20px;color:#111;">
      <div style="text-align:center;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:15px;">
        <h1 style="margin:0;font-size:20px;">${DB.company.name}</h1>
        <div style="font-size:16px;font-weight:bold;margin-top:8px;">BALANCE SHEET</div>
        <div style="font-size:12px;">As of ${asOf}</div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px;">
        <thead><tr style="background:#eee;"><th style="padding:5px;border:1px solid #ccc;text-align:left;" colspan="2">Assets</th></tr></thead>
        <tbody>${rowsHtml(groups.Asset)}</tbody>
        <tfoot><tr style="font-weight:bold;border-top:2px solid #333;"><td style="padding:6px;">Total Assets</td><td style="padding:6px;text-align:right;">${fmt(Math.abs(totalAssets))}</td></tr></tfoot>
      </table>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px;">
        <thead><tr style="background:#eee;"><th style="padding:5px;border:1px solid #ccc;text-align:left;" colspan="2">Liabilities</th></tr></thead>
        <tbody>${rowsHtml(groups.Liability)}</tbody>
        <tfoot><tr style="font-weight:bold;border-top:2px solid #333;"><td style="padding:6px;">Total Liabilities</td><td style="padding:6px;text-align:right;">${fmt(Math.abs(totalLiabilities))}</td></tr></tfoot>
      </table>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px;">
        <thead><tr style="background:#eee;"><th style="padding:5px;border:1px solid #ccc;text-align:left;" colspan="2">Equity</th></tr></thead>
        <tbody>${rowsHtml(groups.Equity)}</tbody>
        <tfoot><tr style="font-weight:bold;border-top:2px solid #333;"><td style="padding:6px;">Total Equity</td><td style="padding:6px;text-align:right;">${fmt(Math.abs(totalEquity))}</td></tr></tfoot>
      </table>
      <div style="font-size:13px;font-weight:bold;color:${balanced?'#059669':'#dc2626'};">
        ${balanced ? `Balanced: Assets = Liabilities + Equity (${fmt(Math.abs(totalLiabilities+totalEquity))})` : `Mismatch: Assets (${fmt(Math.abs(totalAssets))}) vs Liabilities + Equity (${fmt(Math.abs(totalLiabilities+totalEquity))})`}
      </div>
    </div>`;
  window.print();
}

/* ================= INIT ================= */
const LICENSE_KEY = 'shree_erp_unlocked';
function startApp(){
  document.getElementById('gateScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadDB();
  render();
  lucide.createIcons();
  document.getElementById('hamburgerBtn').addEventListener('click', openSidebar);
  document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
}
document.addEventListener('DOMContentLoaded', ()=>{
  lucide.createIcons();
  if(localStorage.getItem(LICENSE_KEY)==='true'){
    startApp();
    return;
  }
  const pwInput = document.getElementById('gatePassword');
  const gateError = document.getElementById('gateError');
  function tryUnlock(){
    // MOCK CHECK ONLY — hardcoded client-side password for prototyping.
    // Replace with real server-side license verification before production use.
    if(pwInput.value === '123456'){
      localStorage.setItem(LICENSE_KEY, 'true');
      gateError.classList.add('hidden');
      startApp();
    } else {
      gateError.classList.remove('hidden');
    }
  }
  document.getElementById('gateSubmit').addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryUnlock(); });
});
</script>
